spring:
  application:
    name: finance-web

  # 本地私有配置（数据库口令、第三方密钥）放在 application-local.yml 中，
  # 该文件已被 .gitignore 排除，不会进入版本库。不存在时自动跳过，不影响启动。
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:match}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

# 大模型兜底分类：未配置 API Key 时该能力自动降级，不影响规则与贝叶斯分类
llm:
  api-key: ${LLM_API_KEY:}
  api-url: ${LLM_API_URL:https://api.deepseek.com/chat/completions}
  model-name: ${LLM_MODEL_NAME:deepseek-flash}

app:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      # 支付详情页截图落盘目录，默认放在项目内的 data/bills（已被 .gitignore 排除）
      base: ${STORAGE_BASE:./data/bills}

# 阿里云 OCR：未配置时 OCR 识别接口返回未启用提示，其余功能不受影响
aliyun:
  ocr:
    access-key-id: ${ALIYUN_OCR_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OCR_ACCESS_KEY_SECRET:}
